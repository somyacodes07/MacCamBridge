name: Release & Deploy Website

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1, or leave blank to auto-increment from latest tag)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Determine Dynamic Semantic Version
  # -------------------------------------------------------------
  prepare-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
      is_release: ${{ steps.calc_version.outputs.is_release }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: calc_version
        run: |
          IS_RELEASE="false"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            IS_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_RELEASE="true"
            if [ -n "${{ github.event.inputs.version }}" ]; then
              VERSION="${{ github.event.inputs.version }}"
              if [[ ! "$VERSION" =~ ^v ]]; then
                VERSION="v$VERSION"
              fi
            else
              LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
              if [ -n "$LATEST_TAG" ]; then
                BASE_VER=${LATEST_TAG#v}
                MAJOR=$(echo "$BASE_VER" | cut -d. -f1)
                MINOR=$(echo "$BASE_VER" | cut -d. -f2)
                PATCH=$(echo "$BASE_VER" | cut -d. -f3)
                NEXT_PATCH=$((PATCH + 1))
                VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
              else
                VERSION="v1.0.${{ github.run_number }}"
              fi
            fi
          else
            # Push to main branch (CD build / website deployment)
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            VERSION="${LATEST_TAG:-v1.0.0}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Determined Version: $VERSION (Create Release: $IS_RELEASE)"

  # -------------------------------------------------------------
  # Build macOS Release DMG
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS Release DMG
    needs: [prepare-version]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS App & DMG
        run: |
          chmod +x build_mac_dmg.sh
          ./build_mac_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCamBridge-macOS-DMG
          path: MacCamBridge-macOS.dmg
          if-no-files-found: error

  # -------------------------------------------------------------
  # Build Windows Receivers (.exe)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Receivers (.exe)
    needs: [prepare-version]
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: WindowsReceiver/package-lock.json

      - name: Install Windows Receiver Dependencies
        run: |
          cd WindowsReceiver
          npm install

      - name: Package Windows Installers & Portable EXEs
        run: |
          cd WindowsReceiver
          npx electron-builder --win --x64

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Receiver-Executables
          path: |
            WindowsReceiver/dist/*.exe
          if-no-files-found: error

  # -------------------------------------------------------------
  # Publish Official GitHub Release (On Tag or Workflow Dispatch)
  # -------------------------------------------------------------
  publish-release:
    name: Publish Official GitHub Release
    needs: [prepare-version, build-macos, build-windows]
    if: needs.prepare-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: MacCamBridge-macOS-DMG
          path: release_files

      - name: Download Windows Executables Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-Receiver-Executables
          path: release_files

      - name: Generate Checksums
        run: |
          cd release_files
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.version }}
          name: MacCam Bridge Release ${{ needs.prepare-version.outputs.version }}
          files: release_files/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          body: |
            ## 🚀 MacCam Bridge ${{ needs.prepare-version.outputs.version }}

            Broadcast your MacBook Camera to Windows 10/11 with sub-5ms ultra-low latency over Wi-Fi or USB-C.

            ---

            ### 📦 Download Assets:
            - **macOS Installer**: `MacCamBridge-macOS.dmg` (Universal Apple Silicon & Intel)
            - **Windows Setup Wizard**: `MacCam-Bridge-Setup-Windows-x64-*.exe`
            - **Windows Portable**: `MacCam-Bridge-Portable-Windows-x64-*.exe` (Standalone zero-install)

            ---

            ### 🛡️ First Launch Security Bypass:
            - **macOS**: Right-Click `MacCamBridge.app` → Click **Open** → Click **Open**, or run:
              ```bash
              xattr -cr /Applications/MacCamBridge.app
              ```
            - **Windows**: On the blue SmartScreen dialog, click **More info** → **Run anyway**.

            ---

            ### ✨ Key Features:
            - **Hardware-Accelerated Encoding**: VideoToolbox H.264 & Chromium WebCodecs GPU decoding.
            - **USB-C Direct Link**: 40 Gbps zero-latency link over peer-to-peer USB-C (`169.254.x.x`).
            - **Native Virtual Webcam**: Directly exposed as `"MacCam Bridge Camera"` for Discord, Zoom, OBS Studio, and Teams.
            - **Zero Config Bonjour Discovery**: Instantly connects over local Wi-Fi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # Deploy Documentation Website to GitHub Pages
  # -------------------------------------------------------------
  deploy-pages:
    name: Deploy Website to GitHub Pages
    needs: [prepare-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
